[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satisfactory-planner"
version = "0.1.0"
description = "A PyQt6-based GUI tool for planning and optimizing factory layouts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Satisfactory Planner Contributors"}
]
keywords = ["satisfactory", "factory", "planner", "optimization", "pyqt6"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "PyQt6>=6.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.0",
]

[project.scripts]
satisfactory-planner = "satisfactory_planner.main:main"

[project.gui-scripts]
satisfactory-planner-gui = "satisfactory_planner.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["satisfactory_planner*"]

[tool.setuptools.package-data]
satisfactory_planner = ["data/*"]
