[project]
name = "satisfactory-planner"
version = "0.1.0"
description = "A PCB-style factory floor planner for Satisfactory"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "PySide6-QtAds>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "mypy>=1.10",
    "ruff>=0.4",
]

[project.scripts]
satisfactory-planner = "satisfactory_planner.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satisfactory_planner"]

[tool.hatch.build.targets.sdist]
include = ["src/"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-v"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
plugins = []

[[tool.mypy.overrides]]
module = [
    "PySide6.*",
    "PySide6QtAds.*",
]
ignore_missing_imports = true

# Vendored third-party code - skip type checking
[[tool.mypy.overrides]]
module = [
    "satisfactory_planner.core.linprog",
]
ignore_errors = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# Exclude vendored third-party code
exclude = [
    "spikes/flowsim/linprog.py",
    "spikes/scipy_size_test/linprog.py",
    "src/satisfactory_planner/core/linprog.py",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["satisfactory_planner"]
