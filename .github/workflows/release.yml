name: Build Release

# Trigger: push a tag like v1.0.0, or run manually from Actions tab
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_release:
        description: 'Build only, skip creating GitHub release'
        type: boolean
        default: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: satisfactory-planner-linux
            extension: .bin
          - os: windows-latest
            artifact: satisfactory-planner-windows
            extension: .exe
          - os: macos-latest
            artifact: satisfactory-planner-macos
            extension: .app

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          
      - name: Install dependencies (Unix)
        if: runner.os != 'Windows'
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install nuitka

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          .venv\Scripts\activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install nuitka

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf

      - name: Build with pyside6-deploy (Unix)
        if: runner.os != 'Windows'
        run: |
          source .venv/bin/activate
          pyside6-deploy -c pysidedeploy.spec

      - name: Build with pyside6-deploy (Windows)
        if: runner.os == 'Windows'
        run: |
          .venv\Scripts\activate
          pyside6-deploy -c pysidedeploy.spec

      - name: Find and upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            sfplanner${{ matrix.extension }}
            sfplanner.app
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && !inputs.skip_release

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}