[project]
name = "scipy-size-test"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyside6-deploy]
# Nuitka options for size testing
app_name = "scipy_test"
entry_point = "main.py"
